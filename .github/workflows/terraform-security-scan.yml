# ============================================================
# GitHub Actions — Terraform Security Scan (Standalone Gate)
# ============================================================
# Runs tfsec, checkov, and trivy on every push and daily.
# Uploads SARIF results to GitHub Security tab.
# Fails the build on any HIGH or CRITICAL finding.
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  tfsec:
    name: tfsec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-sarif-action@v1
        with:
          sarif_file: tfsec.sarif
          soft_fail: false
          additional_args: >-
            --minimum-severity HIGH
            --exclude-downloaded-modules
            --format sarif

      - name: Upload tfsec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec.sarif
          category: tfsec

  checkov:
    name: checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
          quiet: true
          skip_check: >-
            CKV_AWS_144,CKV_AWS_145
          check: >-
            CKV_AWS_18,CKV_AWS_19,CKV_AWS_20,CKV_AWS_21,
            CKV_AWS_52,CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,
            CKV_AWS_56,CKV_AWS_57,CKV_AWS_70,CKV_AWS_86,
            CKV_AWS_158

      - name: Upload checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  trivy:
    name: trivy (IaC scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  terraform-lint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history for secret scanning

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
