# ============================================================
# GitHub Actions — Terraform Apply
# ============================================================
# Triggered on merge to main (dev auto-deploys, test/prod need
# manual approval via GitHub Environment protection rules).
# Uses OIDC — no AWS access keys stored in GitHub Secrets.
# ============================================================

name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Portfolio Mode Deploy Check
        run: |
          if [ "${{ secrets.AWS_ROLE_ARN_DEV }}" = "" ]; then
            echo "AWS credentials not configured. Skipping apply for public portfolio repository."
          else
            echo "Running deployment..."
          fi