# ============================================================
# GitHub Actions — Terraform Apply
# ============================================================
# Triggered on merge to main (dev auto-deploys, test/prod need
# manual approval via GitHub Environment protection rules).
# Uses OIDC — no AWS access keys stored in GitHub Secrets.
# ============================================================

name: Terraform Apply

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.AWS_ROLE_ARN_DEV != '' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deployment workflow enabled only when AWS secrets exist."